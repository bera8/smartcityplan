<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCityPlan - Mozgásban a jövő</title>
    <style>
        /* 1. ALAPOK */
        body {
            background-color: #ffffff;
            color: #333333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        .background-text-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* --- A PROFI NAGY FEJLÉC VISSZAÁLLÍTÁSA --- */
        .hero-section {
            position: relative;
            width: 100%;
            height: 75vh; /* A képernyő 75%-át kitölti */
            min-height: 500px;
            /* Ide tettem a sötétített hátteret, hogy a fehér betűk profin látszódjanak */
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('jovokep.png'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed; /* Ez adja azt a prémium "úszó" hatást görgetéskor */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            margin-bottom: 40px;
        }

        .small-logo {
            width: 120px; /* Elegánsabb, kisebb méret */
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0px 4px 10px rgba(0,0,0,0.5));
        }

        .hero-section h1 {
            font-size: 4.5rem;
            margin: 0;
            text-shadow: 0px 5px 20px rgba(0,0,0,0.8);
            letter-spacing: 5px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .hero-section p {
            font-size: 2rem;
            font-style: italic;
            text-shadow: 0px 2px 10px rgba(0,0,0,0.8);
            margin-top: 10px;
            font-weight: 300;
        }

        /* --- KÁRTYÁK ELRENDEZÉSE (FEJLÉC ALATT) --- */
        .cards {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 20px;
            flex-wrap: wrap;
            margin-bottom: 50px;
        }

        .card {
            position: relative;
            width: 300px;
            height: 400px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
            transition: transform 0.4s ease;
        }

        .card:hover { transform: translateY(-15px); }

        .card img { width: 100%; height: 100%; object-fit: cover; }

        .card-label {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            color: #0056b3;
            padding: 20px 0;
            font-weight: bold;
            font-size: 1.2rem;
            text-transform: uppercase;
        }

        /* --- VIDEÓ ÉS LEÍRÁS --- */
        .video-container {
            margin: 0 auto 60px auto;
            max-width: 800px;
            width: 90%;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }

        .video-container iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
        }

        .description-text {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 30px;
            text-align: justify;
            line-height: 1.9;
            font-size: 1.2rem;
            color: #444;
        }

        footer {
            padding: 60px;
            background: #f8f9fa;
            color: #999;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>

    <div id="bg-text" class="background-text-container"></div>

    <header class="hero-section">
        <img src="LOGO1.png" alt="Logo" class="small-logo">
        <h1>SmartCityPlan</h1>
        <p>Mozgásban a jövő</p>
    </header>

    <main>
        <section class="cards">
            <div class="card">
                <img src="zolditesi-terv.png" alt="Zöld Energia">
                <div class="card-label">ZÖLD ENERGIA</div>
            </div>
            <div class="card">
                <img src="jelenlegi-allapot.png" alt="Okos Megoldások">
                <div class="card-label">OKOS MEGOLDÁSOK</div>
            </div>
            <div class="card">
                <img src="jovokep.png" alt="Fenntartható Jövő">
                <div class="card-label">FENNTARTHATÓ JÖVŐ</div>
            </div>
        </section>

        <section class="video-container">
            <iframe src="https://www.youtube.com/embed/17yjJXmKXG0" allowfullscreen></iframe>
        </section>

        <section class="description-text">
            <p>Az <strong>OkosVáros</strong> projekt egy olyan egyedi vízió, amely a kinetikus és egyéb energiák urbanisztikai hasznosítására épül. Célunk a jövő városainak fenntarthatóbbá tétele.</p>
        </section>
    </main>

    <footer>
        <p>Minden jog fenntartva © 2026 Bertus Erika</p>
    </footer>

    <script>
        const words = ["SMART CITY", "ZÖLD ENERGIA", "INNOVÁCIÓ", "BUDAPEST", "FENNTARTHATÓ", "KINETIKUS"];
        const bgContainer = document.getElementById('bg-text');

        function createMovingText() {
            const span = document.createElement('span');
            span.innerText = words[Math.floor(Math.random() * words.length)];
            span.style.position = 'absolute';
            span.style.color = 'rgba(0, 86, 179, 0.12)'; 
            span.style.left = Math.random() * 100 + 'vw';
            span.style.top = Math.random() * 100 + 'vh';
            span.style.fontSize = (Math.random() * 2 + 1) + 'rem';
            span.style.transition = 'all 20s linear';
            bgContainer.appendChild(span);

            setTimeout(() => {
                span.style.left = Math.random() * 100 + 'vw';
                span.style.top = Math.random() * 100 + 'vh';
            }, 100);

            setTimeout(() => { span.remove(); }, 20000);
        }
        setInterval(createMovingText, 2000);
    </script>
</body>
</html>
